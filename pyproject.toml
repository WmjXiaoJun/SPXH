[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spxh"
version = "0.1.0"
description = "SPXH · 智能射频信号分析平台 (Smart RF Signal Analysis Platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["scikit-learn>=1.3", "joblib>=1.3"]
plot = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
storage = ["h5py>=3.9"]

[project.scripts]
spxh = "spxh.cli.main:main"

[tool.setuptools.packages.find]
include = ["spxh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
